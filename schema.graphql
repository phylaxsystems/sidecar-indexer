type AssertionAdded @entity {
  id: ID!
  block: Int! @index
  txHash: String!
  logIndex: Int!
  assertionAdopter: String! @index
  assertionId: String! @index
  activationBlock: BigInt!
  daVerifier: String!
  metadata: String!
  proof: String!
}

type AssertionRemoved @entity {
  id: ID!
  block: Int! @index
  txHash: String!
  logIndex: Int!
  assertionAdopter: String! @index
  assertionId: String! @index
  deactivationBlock: BigInt!
}

type StorageReset @entity {
  id: ID!
  block: Int! @index
  txHash: String!
  logIndex: Int!
  adopter: String! @index
  storageKey: String! @index
  resetBlock: BigInt!
}

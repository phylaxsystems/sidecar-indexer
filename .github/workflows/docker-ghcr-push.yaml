name: Docker GHCR Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for Docker images (e.g. 1.0.3-patch)."
        required: false
        type: string

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Determine version tag
        id: determine-version
        run: |
          # Use manual input if provided
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "Using manually specified version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else                                                                                                                                                         
            VERSION="${{ github.sha }}"
            echo "Version unchanged, falling back to commit SHA: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  docker-ghcr-push-sidecar-indexer:
    needs: get-version
    uses: phylaxsystems/actions/.github/workflows/release-docker-ghcr-nodejs.yaml@main
    with:
      app-name: sidecar-indexer
      node-version: "24.11"
      dockerfile-path: Dockerfile
      version-tag: ${{ needs.get-version.outputs.version }}

  deploy-shadow:
    # The publisher only pushes images for push events; manual builds do not
    # produce a deployable tag. Wait for publication before updating GitOps.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [get-version, docker-ghcr-push-sidecar-indexer]
    uses: phylaxsystems/credible-sdk/.github/workflows/gitops-deploy.yaml@main
    with:
      image-tag: ${{ needs.get-version.outputs.version }}
      releases: |
        [
          {"values-path":"applications/shadow-layer/eth/sidecar-indexer/values.yaml","image-repository":"ghcr.io/phylaxsystems/sidecar-indexer/sidecar-indexer"},
          {"values-path":"applications/shadow-layer/linea/sidecar-indexer/values.yaml","image-repository":"ghcr.io/phylaxsystems/sidecar-indexer/sidecar-indexer"}
        ]
    secrets:
      ARGOCD_DEPLOYER_PRIVATE_KEY: ${{ secrets.ARGOCD_DEPLOYER_PRIVATE_KEY }}
